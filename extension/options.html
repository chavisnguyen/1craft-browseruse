<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>browseruse bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 32px 16px;
      background-color: #f8f9fa;
      color: #202124;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border: 1px solid #dadce0;
      border-radius: 8px;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 500;
      color: #202124;
      border-bottom: 1px solid #f1f3f4;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
      color: #5f6368;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      font-size: 13px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      color: #202124;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: #1a73e8;
    }
    .help-text {
      font-size: 11px;
      color: #70757a;
      margin-top: 4px;
    }
    .btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      height: 34px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s;
      margin-top: 8px;
    }
    .btn:hover {
      background-color: #1557b0;
    }
    .status-card {
      margin-top: 20px;
      padding: 12px 14px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 6px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-key {
      color: #5f6368;
    }
    .status-val {
      font-weight: 500;
      color: #202124;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dadce0;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot.connected {
      background: #1e8e3e;
    }
    .dot.disconnected {
      background: #d93025;
    }
    .alert {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      display: none;
      font-size: 12px;
    }
    .alert-success {
      background: #e6f4ea;
      color: #137333;
    }
    .alert-error {
      background: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 data-i18n="optionsTitle"></h2>

    <div id="alertBox" class="alert"></div>

    <form id="optionsForm">
      <div class="form-group">
        <label for="labelInput" data-i18n="profileLabel"></label>
        <input type="text" id="labelInput" required pattern="^[a-zA-Z0-9_.-]{1,32}$" data-i18n-placeholder="profilePlaceholder" spellcheck="false" />
        <div class="help-text" data-i18n="invalidLabel"></div>
      </div>

      <div class="form-group">
        <label for="tokenInput" data-i18n="daemonToken"></label>
        <input type="password" id="tokenInput" required minlength="64" maxlength="64" spellcheck="false" />
        <div class="help-text" data-i18n="daemonTokenHelp"></div>
      </div>

      <div class="form-group">
        <label for="daemonUrlInput" data-i18n="daemonUrl"></label>
        <input type="text" id="daemonUrlInput" value="ws://127.0.0.1:3025/ext" required spellcheck="false" />
      </div>

      <div class="form-group">
        <label for="windowModeSelect" data-i18n="windowMode"></label>
        <select id="windowModeSelect">
          <option value="dedicated" selected data-i18n="windowModeDedicated"></option>
          <option value="current" data-i18n="windowModeCurrent"></option>
        </select>
        <div class="help-text" data-i18n="windowModeHelp"></div>
      </div>

      <button type="submit" class="btn" id="saveBtn" data-i18n="save"></button>
    </form>

    <div class="status-card">
      <div class="status-row">
        <span class="status-key" data-i18n="statusConnected"></span>
        <span class="status-val">
          <span id="connDot" class="dot"></span>
          <span id="connStatusText"></span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-key" data-i18n="account"></span>
        <span id="userEmail" class="status-val">-</span>
      </div>
      <div class="status-row">
        <span class="status-key" data-i18n="instanceId"></span>
        <span id="instanceId" class="status-val" style="font-family: monospace; font-size: 11px;">-</span>
      </div>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
