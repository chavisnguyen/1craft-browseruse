<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>browseruse bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-on {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-off {
      background: #fee2e2;
      color: #b91c1c;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    input[type="text"] {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button.btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button.btn-primary:hover {
      background: #1d4ed8;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #475569;
    }
    .info-val {
      font-weight: 600;
      color: #0f172a;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .btn-secondary {
      flex: 1;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .toast {
      display: none;
      background: #10b981;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🌐 browseruse bridge</div>
    <span id="connBadge" class="badge badge-off">Offline</span>
  </div>

  <div class="card">
    <div class="field-label">Nhãn Profile (Profile Label)</div>
    <div class="input-row">
      <input type="text" id="labelInput" placeholder="ví dụ: company_chavis.work" spellcheck="false" />
      <button id="saveBtn" class="btn-primary">Lưu</button>
    </div>

    <div class="info-row">
      <span>Tài khoản Chrome:</span>
      <span id="emailVal" class="info-val">...</span>
    </div>
    <div class="info-row">
      <span>Tab Agent quản lý:</span>
      <span id="tabsVal" class="info-val">0 tab</span>
    </div>
  </div>

  <div class="actions">
    <button id="optionsBtn" class="btn-secondary">⚙️ Tuỳ chọn nâng cao</button>
    <button id="reconnectBtn" class="btn-secondary">🔄 Kết nối lại</button>
  </div>

  <div id="toast" class="toast">Đã cập nhật nhãn!</div>

  <script src="popup.js"></script>
</body>
</html>
