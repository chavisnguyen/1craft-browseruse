<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>browseruse bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #202124;
      background: #ffffff;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: #202124;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #5f6368;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dadce0;
      display: inline-block;
      transition: background-color 0.2s;
    }
    .dot.connected {
      background: #1e8e3e;
    }
    .dot.disconnected {
      background: #d93025;
    }
    .field {
      margin-bottom: 14px;
    }
    .label {
      font-size: 11px;
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 5px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      color: #202124;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #1a73e8;
    }
    button.primary-btn {
      height: 32px;
      padding: 0 14px;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
      white-space: nowrap;
    }
    button.primary-btn:hover {
      background: #1557b0;
    }
    .meta-list {
      border-top: 1px solid #f1f3f4;
      padding-top: 12px;
      margin-bottom: 14px;
    }
    .meta-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .meta-key {
      color: #5f6368;
    }
    .meta-val {
      color: #202124;
      font-weight: 500;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f3f4;
      padding-top: 12px;
    }
    .link-btn {
      background: none;
      border: none;
      color: #1a73e8;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }
    .link-btn:hover {
      text-decoration: underline;
    }
    .secondary-link {
      color: #5f6368;
    }
    .secondary-link:hover {
      color: #202124;
    }
    .feedback {
      display: none;
      font-size: 11px;
      margin-top: 6px;
      color: #1e8e3e;
    }
    .feedback.error {
      color: #d93025;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="app-name" data-i18n="extName">1craft BrowserUse</div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText"></span>
    </div>
  </div>

  <div class="field">
    <div class="label" data-i18n="profileLabel"></div>
    <div class="input-row">
      <input type="text" id="labelInput" spellcheck="false" data-i18n-placeholder="profilePlaceholder" />
      <button id="saveBtn" class="primary-btn" data-i18n="save"></button>
    </div>
    <div id="feedback" class="feedback"></div>
  </div>

  <div class="meta-list">
    <div class="meta-item">
      <span class="meta-key" data-i18n="account"></span>
      <span id="emailVal" class="meta-val"></span>
    </div>
    <div class="meta-item">
      <span class="meta-key" data-i18n="activeTabs"></span>
      <span id="tabsVal" class="meta-val">0</span>
    </div>
  </div>

  <div class="footer">
    <button id="optionsBtn" class="link-btn" data-i18n="settings"></button>
    <button id="reconnectBtn" class="link-btn secondary-link" data-i18n="reconnect"></button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
