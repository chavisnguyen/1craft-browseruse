<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="whiteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Browser tab bar outline at top -->
  <path d="M 96 150 L 190 150 Q 200 150 206 142 L 224 116 Q 230 108 240 108 L 380 108 Q 390 108 396 116 L 414 142 Q 420 150 430 150 L 416 150" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>

  <!-- Crafted Geometric '1' + Cursor Symbol -->
  <g filter="url(#glow)">
    <!-- Angled wing/flag of the 1 (Electric Blue) -->
    <path d="M 154 260 L 252 144 Q 258 136 268 136 L 274 136 L 274 246 L 196 294 Z" fill="url(#brandBlue)"/>
    
    <!-- Main stem of the 1 (Crisp White) -->
    <rect x="254" y="136" width="84" height="240" rx="12" fill="url(#whiteGlow)"/>

    <!-- Dynamic base foundation (Deep Slate / Blue cut) -->
    <path d="M 176 376 L 356 376 Q 366 376 366 386 L 366 394 Q 366 404 356 404 L 176 404 Q 166 404 166 394 L 166 386 Q 166 376 176 376 Z" fill="url(#whiteGlow)"/>
  </g>

  <!-- Glowing cyan node (AI connection spark) -->
  <circle cx="266" cy="136" r="16" fill="#38bdf8"/>
</svg>
